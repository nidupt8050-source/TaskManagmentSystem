<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' | SmartTask'">SmartTask</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:fragment="topbar" class="topbar">
    <a class="brand" th:href="@{/dashboard}">
        <span class="brand-mark">ST</span>
        <span>SmartTask</span>
    </a>

    <nav class="nav">
        <a th:href="@{/dashboard}" th:classappend="${currentPage == 'dashboard'} ? ' active'">Dashboard</a>
        <a th:href="@{/tasks}" th:classappend="${currentPage == 'tasks'} ? ' active'">My Tasks</a>
        <a th:href="@{/tasks/new}" th:classappend="${currentPage == 'new'} ? ' active'">New Task</a>
    </nav>

    <div class="user-chip">
        <span class="avatar" th:text="${session.userName != null ? #strings.substring(session.userName,0,1) : 'U'}">U</span>
        <span th:text="${session.userName}">User</span>
        <a class="logout" th:href="@{/logout}">Logout</a>
    </div>
</header>
</body>
</html>
